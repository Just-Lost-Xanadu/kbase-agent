[project]
name = "kbase-agent"
version = "0.1.0"
description = "企业知识库 + 工具调用 Agent（LangGraph + MCP + RAG），求职学习项目"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3",
    "mcp[cli]>=1.2.0",
    "langchain-mcp-adapters>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "fastembed>=0.3",
    "python-dotenv>=1.0",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# 本地 bge-m3 / bge-reranker 需要 torch（体积大），仅做精度升级时才装：
#   pip install -e ".[embed]"
embed = ["FlagEmbedding>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
