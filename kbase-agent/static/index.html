<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>kbase-agent · 企业知识库 + 工具调用 Agent</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #0f1419; color: #e6e6e6; height: 100vh; display: flex;
  }
  #sidebar {
    width: 264px; flex-shrink: 0; background: #151b23; border-right: 1px solid #262d36;
    display: flex; flex-direction: column;
  }
  #sidebar .brand { padding: 14px 16px 10px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #262d36; }
  #sidebar .brand small { display: block; font-weight: 400; color: #8b98a5; font-size: 11px; margin-top: 2px; }
  #newChat {
    margin: 12px; padding: 8px 0; background: #2563eb; color: #fff; border: none; border-radius: 8px;
    font-size: 13px; cursor: pointer;
  }
  #newChat:hover { background: #1d4ed8; }
  #sessionList { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .session-item {
    width: 100%; text-align: left; background: transparent; color: #cbd5e1; border: none; border-radius: 8px;
    padding: 10px 12px; cursor: pointer; margin-bottom: 2px;
  }
  .session-item:hover { background: #1c242e; }
  .session-item.active { background: #1d4ed8; color: #fff; }
  .session-item .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .m { font-size: 11px; color: #8b98a5; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item.active .m { color: #dbeafe; }
  .session-item .meta { display: flex; justify-content: space-between; margin-top: 2px; font-size: 10px; color: #64748b; }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 14px 20px; border-bottom: 1px solid #262d36; background: #151b23; display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12px; color: #8b98a5; }
  #log { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .user { align-self: flex-end; background: #1d4ed8; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #1c242e; border-bottom-left-radius: 4px; }
  .sources { margin-top: 8px; font-size: 12px; color: #7dd3fc; }
  .sources span { background: #123a4f; padding: 2px 8px; border-radius: 10px; margin-right: 6px; white-space: nowrap; }
  #status { display: none; font-size: 12px; color: #fbbf24; padding: 0 20px 8px; }
  #chips { display: flex; gap: 8px; padding: 0 20px 10px; flex-wrap: wrap; }
  #chips button { background: #1c242e; color: #cbd5e1; border: 1px solid #2a3441; border-radius: 14px;
    padding: 5px 12px; font-size: 12px; cursor: pointer; }
  #chips button:hover { border-color: #3b82f6; color: #fff; }
  footer { display: flex; gap: 10px; padding: 12px 20px; border-top: 1px solid #262d36; background: #151b23; }
  #input { flex: 1; background: #1c242e; border: 1px solid #2a3441; border-radius: 10px; color: #e6e6e6;
    padding: 10px 14px; font-size: 14px; outline: none; }
  #input:focus { border-color: #3b82f6; }
  #send { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 0 22px; cursor: pointer; font-size: 14px; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: #f87171; }
  #emptyTip { text-align: center; color: #55636f; margin-top: 40px; font-size: 13px; line-height: 2; }
  @media (max-width: 720px) { #sidebar { display: none; } }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">kbase-agent<small>会话记录存 data/checkpoints.sqlite，重启可续聊</small></div>
  <button id="newChat">＋ 新对话</button>
  <div id="sessionList"></div>
</aside>

<section id="chat">
  <header>
    <h1>kbase-agent 演示</h1>
    <p id="sessionLabel">新会话</p>
  </header>
  <div id="log"><div id="emptyTip">问点什么吧，例如：<br>张三还剩几天年假？按手册能结转吗？</div></div>
  <div id="status">Agent 思考中…（可能需要多步工具调用）</div>
  <div id="chips">
    <button data-q="张三还剩几天年假？结合制度规则回答">查张三个人数据</button>
    <button data-q="出差住宿报销上限是多少？">报销标准</button>
    <button data-q="每月什么时候发工资？">发薪规则</button>
  </div>
  <footer>
    <input id="input" placeholder="输入问题，Enter 发送（同会话历史由服务端自动续接）" autocomplete="off">
    <button id="send">发送</button>
  </footer>
</section>

<script>
  // —— 会话标识：localStorage 记住当前会话，刷新后回看并可续聊 ——
  const LS_KEY = 'kbase_session_id';
  const genId = () => (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
  let sessionId = localStorage.getItem(LS_KEY) || genId();

  const log = document.getElementById('log'), statusEl = document.getElementById('status');
  const input = document.getElementById('input'), sendBtn = document.getElementById('send');
  const listEl = document.getElementById('sessionList'), newBtn = document.getElementById('newChat');
  const labelEl = document.getElementById('sessionLabel');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function addMsg(role, text, sources) {
    const tip = document.getElementById('emptyTip');
    if (tip) tip.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    div.innerHTML = esc(text);
    if (sources && sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.innerHTML = sources.map(x => '<span>来源：' + esc(x) + '</span>').join('');
      div.appendChild(s);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }
  function setBusy(b) {
    sendBtn.disabled = b; statusEl.style.display = b ? 'block' : 'none';
  }
  async function api(path, opts) {
    const resp = await fetch(path, opts);
    if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || ('HTTP ' + resp.status));
    return resp.json();
  }
  function fmtTime(s) {
    const d = new Date(s.replace(' ', 'T'));
    const p = n => String(n).padStart(2, '0');
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function shortLabel(t) { return t.length > 20 ? t.slice(0, 20) + '…' : t; }

  // —— 会话列表 ——
  async function refreshSessions() {
    let list = [];
    try { list = await api('/api/sessions'); } catch (e) { return; }
    listEl.innerHTML = '';
    for (const s of list) {
      const b = document.createElement('button');
      b.dataset.sid = s.id;
      b.className = 'session-item' + (s.id === sessionId ? ' active' : '');
      b.innerHTML = '<div class="t">' + esc(s.title || '（未命名）') + '</div>' +
                    '<div class="m">' + esc(s.last_preview || '') + '</div>' +
                    '<div class="meta"><span>' + s.message_count + ' 条</span><span>' + fmtTime(s.updated_at) + '</span></div>';
      b.addEventListener('click', () => openSession(s.id));
      listEl.appendChild(b);
    }
  }

  // —— 切换 / 回看会话 ——
  async function openSession(id, renderHistory = true) {
    sessionId = id;
    localStorage.setItem(LS_KEY, id);
    labelEl.textContent = '历史会话';
    if (renderHistory) await loadHistory(id);  // loadHistory 内部会刷新列表
  }
  async function loadHistory(id) {
    let msgs = [];
    try { msgs = await api('/api/sessions/' + encodeURIComponent(id) + '/messages'); } catch (e) { msgs = []; }
    const tip = document.getElementById('emptyTip');
    if (tip) tip.remove();
    log.innerHTML = '';
    if (!msgs.length) {
      const d = document.createElement('div');
      d.id = 'emptyTip'; d.innerHTML = '问点什么吧，例如：<br>张三还剩几天年假？按手册能结转吗？';
      log.appendChild(d);
      labelEl.textContent = '新会话';
    } else {
      const first = msgs.find(m => m.role === 'user');
      labelEl.textContent = first ? shortLabel(first.content) : '历史会话';
    }
    for (const m of msgs) addMsg(m.role === 'user' ? 'user' : 'bot', m.content, m.sources || []);
    refreshSessions();
  }

  // —— 新对话 ——
  function newConversation() {
    sessionId = genId();
    localStorage.setItem(LS_KEY, sessionId);
    log.innerHTML = '';
    const d = document.createElement('div');
    d.id = 'emptyTip'; d.innerHTML = '问点什么吧，例如：<br>张三还剩几天年假？按手册能结转吗？';
    log.appendChild(d);
    labelEl.textContent = '新会话';
    [...listEl.querySelectorAll('.session-item.active')].forEach(el => el.classList.remove('active'));
    refreshSessions();
    input.focus();
  }

  // —— 发送：走 /api/chat/stream（SSE 流式），本会话只发最新一条 ——
  async function ask(q) {
    if (!q.trim() || sendBtn.disabled) return;
    addMsg('user', q);
    input.value = '';
    setBusy(true);
    // 占位 bot(空)，收到 done 后以服务端最终 answer 填充
    const placeholder = addMsg('bot', '', null);
    const decoder = new TextDecoder();
    let finalAnswer = '';
    let finalSources = [];
    let sseError = null;
    let stepPreviewEl = null;
    const makePreview = () => {
      if (!stepPreviewEl) {
        stepPreviewEl = document.createElement('div');
        stepPreviewEl.className = 'msg bot'; stepPreviewEl.style.color = '#93a4b3';
        log.appendChild(stepPreviewEl);
      }
      return stepPreviewEl;
    };
    const clearPreview = () => { if (stepPreviewEl) { stepPreviewEl.remove(); stepPreviewEl = null; } };
    const onEvent = (eventName, dataStr) => {
      if (eventName === 'message') {
        try {
          const e = JSON.parse(dataStr);
          if (e && e.type === 'step') {
            if (e.node === 'agent' && e.text) makePreview().textContent = '… ' + e.text;
            else if (e.node === 'tools' && Array.isArray(e.tool_calls) && e.tool_calls.length)
              makePreview().textContent = '工具调用中：' + e.tool_calls.map(t => t.name || '').join(', ');
            else if (e.node === 'tools') makePreview().textContent = '工具调用完成…';
          } else if (e && e.type === 'error') {
            throw new Error(e.message || 'Agent 错误');
          }
        } catch (err) { console.warn('SSE 本地解析', err.message); }
      } else if (eventName === 'done') {
        try { const d = JSON.parse(dataStr); finalAnswer = d.answer || ''; finalSources = d.sources || []; } catch (e) {}
      } else if (eventName === 'error') {
        try { const d = JSON.parse(dataStr); sseError = (d && d.message) || 'Agent 输出错误'; } catch (e) { sseError = 'Agent 输出错误'; }
      }
    };
    // 需在后续 done 里真正抛错提示，sseError 仅在无 finalAnswer 且无真实 answer 时兜底
    const throwIfNoAnswer = () => { if (sseError && !finalAnswer) throw new Error(sseError); };
    try {
      const resp = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: q }], session_id: sessionId }),
      });
      if (!resp.ok) throw new Error(((await resp.json().catch(() => ({}))).detail) || ('HTTP ' + resp.status));
      if (!resp.body) throw new Error('服务端未返回流（无 body）');
      const reader = resp.body.getReader();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        while (true) {
          const nl = buf.indexOf('\n\n');
          if (nl < 0) break;
          const evt = buf.slice(0, nl); buf = buf.slice(nl + 2);
          let evtName = 'message', dataLines = [];
          for (const line of evt.split('\n')) {
            if (line.startsWith('event:')) evtName = line.slice(6).trim();
            else if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
          }
          if (dataLines.length) onEvent(evtName, dataLines.join('\n'));
        }
      }
      throwIfNoAnswer();
      if (finalAnswer) {
        localStorage.setItem(LS_KEY, sessionId);
        placeholder.className = 'msg bot';
        placeholder.textContent = finalAnswer;
        if (finalSources && finalSources.length) {
          const s = document.createElement('div');
          s.className = 'sources';
          s.innerHTML = finalSources.map(x => '<span>来源：' + esc(x) + '</span>').join('');
          placeholder.appendChild(s);
        }
      } else {
        placeholder.textContent = '（空回答）';
      }
      labelEl.textContent = shortLabel(q);
    } catch (e) {
      placeholder.textContent = '出错了：' + e.message + '（检查服务端是否已配置 DEEPSEEK_API_KEY）';
    } finally {
      clearPreview();
      if (placeholder.textContent === '' && placeholder.childNodes.length === 0) placeholder.remove();
      setBusy(false);
      refreshSessions();
      input.focus();
    }
  }

  newBtn.addEventListener('click', newConversation);
  sendBtn.addEventListener('click', () => ask(input.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(input.value); });
  document.querySelectorAll('#chips button').forEach(b =>
    b.addEventListener('click', () => ask(b.dataset.q)));

  // 初次加载：若本地记住过会话则回看，否则开新会话
  if (localStorage.getItem(LS_KEY)) {
    loadHistory(sessionId);
  } else {
    refreshSessions();
  }
  input.focus();
</script>
</body>
</html>
