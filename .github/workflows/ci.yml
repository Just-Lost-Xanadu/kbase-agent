name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kbase-agent
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Offline tests
        run: python -m pytest -q
      - name: Build index
        run: python scripts/index_docs.py
      - name: Retrieval eval + threshold
        run: |
          python scripts/eval.py --json /tmp/eval.json > /tmp/eval.stdout
          python - <<'PY'
          import json
          m = json.load(open('/tmp/eval.json', encoding='utf-8'))
          assert m['topk_hit_rate'] >= 0.95, m
          assert m['citation_accuracy'] >= 0.95, m
          print('retrieval ok:', m['topk_hit_rate'], m['citation_accuracy'])
          PY
      - name: End-to-end smoke
        if: env.DEEPSEEK_API_KEY != ''
        run: python scripts/eval_e2e.py --limit 5
      - name: Multi-turn / tool-boundary smoke
        if: env.DEEPSEEK_API_KEY != ''
        run: python scripts/eval_multi_turn.py --limit 2
